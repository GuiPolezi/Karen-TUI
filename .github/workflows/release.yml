name: Publicar release

# Dispara ao empurrar uma tag v* (ex.: v0.2.0) ou na mão pela aba Actions.
# Monta o executável no Windows, roda os testes e anexa o instalador ao release —
# é dele que o Ctrl+U dentro da TUI baixa a atualização.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar o venv
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[dev,build]"

      - name: Conferir se a tag bate com app.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $versao = (.venv\Scripts\python -c "import app; print(app.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($versao -ne $tag) {
            throw "a tag $tag nao bate com app.__version__ ($versao): atualize app/__init__.py"
          }
          "versao=$versao" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Garantir o Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
        shell: pwsh

      - name: Build (testes + executável + instalador)
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1

      - name: Guardar o resultado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cmd-all-in-one-windows
          path: dist/CMD-ALL-IN-ONE-Setup-*.exe
          if-no-files-found: error

      - name: Anexar o instalador ao release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $instalador = (Get-ChildItem dist\CMD-ALL-IN-ONE-Setup-*.exe | Select-Object -First 1).FullName
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "CMD ALL-IN-ONE $tag" --generate-notes $instalador
          } else {
            gh release upload $tag $instalador --clobber
          }
        shell: pwsh
