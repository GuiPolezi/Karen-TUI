[project]
name = "cmd-all-in-one"
dynamic = ["version"]
description = "Dashboard TUI de suporte: E-mail (IMAP) + Milldesk + ChatPanel em uma única tela"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "imap-tools>=1.7",
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.1",
]
build = [
    "pyinstaller>=6.11",
]
toast = [
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.scripts]
app = "app.main:main"

[tool.hatch.version]
path = "app/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
