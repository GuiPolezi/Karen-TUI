name: Publicar release

# Dispara ao empurrar uma tag v* (ex.: v0.2.0) ou na mão pela aba Actions (útil para testar
# o pipeline sem gastar um número de versão: sem tag, ele monta e guarda o artefato, mas
# não publica release nenhum).
#
# Cada fase é um passo separado de propósito: quando falha, o nome do passo já diz onde.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar o venv
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[dev,build]"

      - name: Conferir se a tag bate com app.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $versao = (.venv\Scripts\python -c "import app; print(app.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($versao -ne $tag) {
            throw "a tag $tag nao bate com app.__version__ ($versao): atualize app/__init__.py"
          }
        shell: pwsh

      - name: Testes
        run: .venv\Scripts\python -m pytest -q
        shell: pwsh

      - name: Guardar o relatório de snapshots quando os testes falham
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-snapshots
          path: snapshot_report.html
          if-no-files-found: ignore

      - name: Executável
        # o teste de abrir o Chromium fica de fora: o runner não tem os navegadores do
        # Playwright baixados (quem faz esse teste é o build local)
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -PularTestes -PularInstalador -PularNavegador

      - name: Garantir o Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /? | Select-Object -First 1
        shell: pwsh

      - name: Instalador
        run: |
          $versao = (.venv\Scripts\python -c "import app; print(app.__version__)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$versao" "packaging\instalador.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou com codigo $LASTEXITCODE" }
          Get-ChildItem dist\CMD-ALL-IN-ONE-Setup-*.exe | ForEach-Object {
            "{0} ({1:N0} MB)" -f $_.Name, ($_.Length / 1MB)
          }
        shell: pwsh

      - name: Guardar o resultado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: cmd-all-in-one-windows
          path: dist/CMD-ALL-IN-ONE-Setup-*.exe
          if-no-files-found: error

      - name: Anexar o instalador ao release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $instalador = (Get-ChildItem dist\CMD-ALL-IN-ONE-Setup-*.exe | Select-Object -First 1).FullName
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "CMD ALL-IN-ONE $tag" --generate-notes $instalador
          } else {
            gh release upload $tag $instalador --clobber
          }
        shell: pwsh
